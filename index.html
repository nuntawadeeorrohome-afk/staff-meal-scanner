<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Staff Meal Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 18px;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: 10px auto;
      background: white;
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      margin: 0 0 5px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 15px;
      font-size: 20px;
      border: 2px solid #ddd;
      border-radius: 10px;
      text-align: center;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #ff7a00;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    #scannerArea {
      display: none;
    }

    #result {
      display: none;
      margin-top: 18px;
      padding: 20px;
      border-radius: 15px;
    }

    .eligible {
      background: #e2f7e7;
      color: #146c2e;
    }

    .used {
      background: #ffdede;
      color: #9c0000;
    }

    .invalid {
      background: #eeeeee;
      color: #444;
    }

    .success {
      background: #d9f7df;
      color: #146c2e;
    }

    .big {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .employee {
      font-size: 19px;
      line-height: 1.6;
    }

    #message {
      margin-top: 12px;
      color: #a00000;
    }

    #scannerStatus {
      margin: 12px 0;
      font-size: 17px;
    }

    iframe {
      display: none;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🍱 Staff Meal Scanner</h1>

  <div class="subtitle">
    ระบบสแกนสิทธิ์รับอาหารพนักงาน
  </div>


  <!-- LOGIN -->

  <div id="loginArea">

    <div style="font-size:22px;font-weight:bold;margin:20px 0 10px;">
      🔐 Staff Login
    </div>

    <div style="margin-bottom:12px;">
      กรุณาใส่ Staff PIN
    </div>

    <input
      id="staffPin"
      type="password"
      inputmode="numeric"
      placeholder="Staff PIN"
    >

    <button onclick="loginStaff()">
      เข้าสู่ระบบ
    </button>

    <div id="message"></div>

  </div>


  <!-- SCANNER -->

  <div id="scannerArea">

    <div id="scannerStatus">
      กดเปิดกล้องเพื่อเริ่มสแกน
    </div>

    <button id="cameraButton" onclick="startScanner()">
      📷 เปิดกล้อง
    </button>

    <div id="reader"></div>

    <div id="result"></div>

  </div>

</div>


<!-- ใช้ส่ง POST ไป Apps Script -->
<iframe
  name="apiFrame"
  id="apiFrame"
  style="display:block; width:100%; height:300px; border:2px solid red;"
></iframe>

<form
  id="apiForm"
  method="POST"
  target="apiFrame"
  action="https://script.google.com/macros/s/AKfycbzQ5cz48hmVvqn-gyrg7TVBwqm0oguBUJMZd0VEZqaE5k-B8akp4msS14sayxI9w1rg/exec"
  style="display:none;"
>
  <input name="action" id="apiAction">
  <input name="pin" id="apiPin">
  <input name="token" id="apiToken">
  <input name="sessionToken" id="apiSession">
  <input name="requestId" id="apiRequestId">
</form>


<script>

const API_ORIGIN = "https://script.google.com";

const SESSION_KEY = "staffMealSessionToken";

let html5QrCode = null;
let scannerRunning = false;
let processing = false;
let currentToken = "";
let pendingAction = "";


/* =========================
   เปิดหน้า
========================= */

window.addEventListener("load", function() {

  const savedSession =
    localStorage.getItem(SESSION_KEY);

  if (savedSession) {

    showScanner();

  } else {

    showLogin();

  }

});


/* =========================
   รับผลจาก Apps Script
========================= */

window.addEventListener("message", function(event) {

  // รับผลจาก callback.html ของ GitHub เท่านั้น
  if (event.origin !== "https://nuntawadeeorrohome-afk.github.io") {
    return;
  }

  const message = event.data;

  if (
    !message ||
    typeof message !== "object" ||
    message.source !== "staff-meal-callback"
  ) {
    return;
  }

  const data = message.data;

  if (!data || typeof data !== "object") {
    return;
  }

  if (pendingAction === "login") {

    handleLoginResult(data);

  } else if (pendingAction === "confirm") {

    handleConfirmResult(data);

  }

});


/* =========================
   ส่งข้อมูลไป Apps Script
========================= */

function sendToApi(action, values) {

  pendingAction = action;

  document.getElementById("apiAction").value =
    action
    
document.getElementById("apiRequestId").value =
  values.requestId || "";
  
  document.getElementById("apiPin").value =
    values.pin || "";

  document.getElementById("apiToken").value =
    values.token || "";

  document.getElementById("apiSession").value =
    values.sessionToken || "";

  document.getElementById("apiForm").submit();
}


/* =========================
   LOGIN
========================= */

function loginStaff() {

  const pin =
    document.getElementById("staffPin").value.trim();

  const message =
    document.getElementById("message");

  if (!pin) {
    message.innerHTML = "กรุณาใส่ Staff PIN";
    return;
  }

  message.innerHTML = "กำลังตรวจสอบ...";

  const requestId =
    Date.now() + "_" +
    Math.random().toString(36).substring(2);

  sendToApi("login", {
    pin: pin,
    requestId: requestId
  });

  setTimeout(function() {
    checkLoginStatus(requestId, 0);
  }, 1500);
}
function checkLoginStatus(requestId, attempt) {

  const callbackName =
    "loginStatus_" + Date.now();

  window[callbackName] = function(data) {

    delete window[callbackName];

    const script =
      document.getElementById("loginStatusScript");

    if (script) {
      script.remove();
    }

    if (data.success === true && data.sessionToken) {

      handleLoginResult(data);

    } else if (data.pending === true && attempt < 5) {

      setTimeout(function() {
        checkLoginStatus(requestId, attempt + 1);
      }, 1000);

    } else {

      const message =
        document.getElementById("message");

      message.innerHTML =
        "❌ ไม่สามารถเข้าสู่ระบบได้ กรุณาลองใหม่";
    }
  };

  const script =
    document.createElement("script");

  script.id = "loginStatusScript";

  script.src =
    "https://script.google.com/macros/s/AKfycbzQ5cz48hmVvqn-gyrg7TVBwqm0oguBUJMZd0VEZqaE5k-B8akp4msS14sayxI9w1rg/exec" +
    "?action=loginStatus" +
    "&requestId=" + encodeURIComponent(requestId) +
    "&callback=" + encodeURIComponent(callbackName);

  document.body.appendChild(script);
}
function handleLoginResult(data) {

  const message =
    document.getElementById("message");

  if (data.success === true && data.sessionToken) {

    localStorage.setItem(
      SESSION_KEY,
      data.sessionToken
    );

    document.getElementById("staffPin").value = "";

    message.innerHTML = "";

    showScanner();

  } else {

    message.innerHTML =
      "❌ " + (data.message || "Staff PIN ไม่ถูกต้อง");

    document.getElementById("staffPin").value = "";

  }
}


/* =========================
   หน้าจอ
========================= */

function showLogin() {

  stopScanner(function() {

    document.getElementById("loginArea").style.display =
      "block";

    document.getElementById("scannerArea").style.display =
      "none";

  });
}


function showScanner() {

  document.getElementById("loginArea").style.display =
    "none";

  document.getElementById("scannerArea").style.display =
    "block";

  document.getElementById("result").style.display =
    "none";

  document.getElementById("cameraButton").style.display =
    "block";

  document.getElementById("scannerStatus").innerHTML =
    "พร้อมใช้งาน — กดเปิดกล้องเพื่อเริ่มสแกน";
}


/* =========================
   เปิดกล้อง
========================= */

function startScanner() {

  if (scannerRunning) {
    return;
  }

  processing = false;
  currentToken = "";

  document.getElementById("result").style.display =
    "none";

  document.getElementById("scannerStatus").innerHTML =
    "กำลังเปิดกล้อง...";

  document.getElementById("cameraButton").style.display =
    "none";


  if (!html5QrCode) {

    html5QrCode =
      new Html5Qrcode("reader");

  }


  html5QrCode.start(

    { facingMode: "environment" },

    {
      fps: 15,

      qrbox: {
        width: 320,
        height: 320
      }
    },

    function(decodedText) {

      handleScan(decodedText);

    },

    function() {
      // ระหว่างค้นหา QR ไม่ต้องแสดง error
    }

  )

  .then(function() {

    scannerRunning = true;

    document.getElementById("scannerStatus").innerHTML =
      "📷 พร้อมสแกน QR พนักงาน";

  })

  .catch(function(error) {

    scannerRunning = false;

    document.getElementById("cameraButton").style.display =
      "block";

    document.getElementById("scannerStatus").innerHTML =
      "❌ เปิดกล้องไม่ได้: " + error;

  });
}


/* =========================
   อ่าน QR
========================= */

function handleScan(decodedText) {

  if (processing) {
    return;
  }

  processing = true;

  const token =
    extractToken(decodedText);

  if (!token) {

    processing = false;

    document.getElementById("scannerStatus").innerHTML =
      "❌ QR ไม่ถูกต้อง";

    return;
  }

  currentToken = token;


  stopScanner(function() {

    document.getElementById("scannerStatus").innerHTML =
      "กำลังตรวจสอบสิทธิ์...";

    checkEmployee();

  });
}


/* =========================
   ดึง token จาก QR
========================= */

function extractToken(text) {

  try {

    const url =
      new URL(text);

    return url.searchParams.get("token") || "";

  } catch (error) {

    return String(text || "").trim();

  }
}


/* =========================
   CHECK
========================= */

function checkEmployee() {

  const sessionToken =
    localStorage.getItem(SESSION_KEY);

  const callbackName =
    "mealCheck_" + Date.now();

  window[callbackName] = function(data) {

    delete window[callbackName];

    const script =
      document.getElementById("jsonpCheck");

    if (script) {
      script.remove();
    }

    handleCheckResult(data);
  };

  const script =
    document.createElement("script");

  script.id = "jsonpCheck";

  script.src =
    "https://script.google.com/macros/s/AKfycbzQ5cz48hmVvqn-gyrg7TVBwqm0oguBUJMZd0VEZqaE5k-B8akp4msS14sayxI9w1rg/exec" +
    "?action=check" +
    "&token=" + encodeURIComponent(currentToken) +
    "&sessionToken=" + encodeURIComponent(sessionToken || "") +
    "&callback=" + encodeURIComponent(callbackName);

  document.body.appendChild(script);
}

function handleCheckResult(data) {

  if (data.status === "unauthorized") {

    localStorage.removeItem(SESSION_KEY);

    currentToken = "";
    processing = false;

    showLogin();

    document.getElementById("message").innerHTML =
      "Session หมดอายุ กรุณาใส่ Staff PIN ใหม่";

    return;
  }

  showResult(data);
}


/* =========================
   แสดงผล
========================= */

function showResult(data) {

  const result =
    document.getElementById("result");

  result.style.display =
    "block";


  if (data.status === "eligible") {

    result.className =
      "eligible";

    result.innerHTML =
      "<div class='big'>🟢 มีสิทธิ์รับอาหาร</div>" +

      "<div class='employee'>" +
      escapeHtml(data.employeeId) + "<br>" +
      escapeHtml(data.name) + "<br>" +
      escapeHtml(data.department) +
      "</div>" +

      "<button id='confirmButton' onclick='confirmMeal()'>" +
      "✅ ยืนยันการรับอาหาร" +
      "</button>" +

      "<button onclick='scanNext()'>" +
      "ยกเลิก / สแกนคนถัดไป" +
      "</button>";


  } else if (data.status === "used") {

    result.className =
      "used";

    result.innerHTML =
      "<div class='big'>🔴 ใช้สิทธิ์แล้ว</div>" +

      "<div class='employee'>" +
      escapeHtml(data.employeeId) + "<br>" +
      escapeHtml(data.name) + "<br>" +
      "รับสิทธิ์เมื่อ " +
      escapeHtml(data.usedAt) +
      "</div>" +

      "<button onclick='scanNext()'>" +
      "📷 สแกนคนถัดไป" +
      "</button>";


  } else if (data.status === "inactive") {

    result.className =
      "used";

    result.innerHTML =
      "<div class='big'>⛔ ไม่มีสิทธิ์</div>" +

      "<div class='employee'>" +
      escapeHtml(data.employeeId) + "<br>" +
      escapeHtml(data.name) +
      "</div>" +

      "<button onclick='scanNext()'>" +
      "📷 สแกนคนถัดไป" +
      "</button>";


  } else {

    result.className =
      "invalid";

    result.innerHTML =
      "<div class='big'>❓ ไม่พบข้อมูล</div>" +

      escapeHtml(data.message || "") +

      "<button onclick='scanNext()'>" +
      "📷 สแกนคนถัดไป" +
      "</button>";

  }

  document.getElementById("scannerStatus").innerHTML =
    "";
}


/* =========================
   CONFIRM
========================= */

function confirmMeal() {

  const button =
    document.getElementById("confirmButton");

  if (button) {

    button.disabled = true;
    button.innerHTML =
      "กำลังยืนยัน...";

  }


  const sessionToken =
    localStorage.getItem(SESSION_KEY);
  
const requestId =
  Date.now() + "_" +
  Math.random().toString(36).substring(2);

  sendToApi("confirm", {
  token: currentToken,
  sessionToken: sessionToken,
  requestId: requestId
});
  
  setTimeout(function() {
  checkConfirmStatus(requestId, 0);
}, 1500);
  
}
function checkConfirmStatus(requestId, attempt) {

  const callbackName =
    "confirmStatus_" + Date.now();

  window[callbackName] = function(data) {

    delete window[callbackName];

    const script =
      document.getElementById("confirmStatusScript");

    if (script) {
      script.remove();
    }

    if (data.pending === true && attempt < 5) {

      setTimeout(function() {
        checkConfirmStatus(requestId, attempt + 1);
      }, 1000);

    } else {

      handleConfirmResult(data);

    }
  };

  const script =
    document.createElement("script");

  script.id = "confirmStatusScript";

  script.src =
    "https://script.google.com/macros/s/AKfycbzQ5cz48hmVvqn-gyrg7TVBwqm0oguBUJMZd0VEZqaE5k-B8akp4msS14sayxI9w1rg/exec" +
    "?action=confirmStatus" +
    "&requestId=" + encodeURIComponent(requestId) +
    "&callback=" + encodeURIComponent(callbackName);

  document.body.appendChild(script);
}

function handleConfirmResult(data) {

  if (data.status === "unauthorized") {

    localStorage.removeItem(SESSION_KEY);

    currentToken = "";
    processing = false;

    showLogin();

    document.getElementById("message").innerHTML =
      "Session หมดอายุ กรุณาใส่ Staff PIN ใหม่";

    return;
  }


  if (data.status === "success") {

    const result =
      document.getElementById("result");

    result.className =
      "success";

    result.innerHTML =
      "<div class='big'>✅ รับอาหารได้</div>" +

      "<div class='employee'>" +
      escapeHtml(data.employeeId) + "<br>" +
      escapeHtml(data.name) + "<br>" +
      escapeHtml(data.department) +
      "</div>" +

      "<button onclick='scanNext()'>" +
      "📷 สแกนคนถัดไป" +
      "</button>";

  } else {

    showResult(data);

  }
}


/* =========================
   คนถัดไป
========================= */

function scanNext() {

  currentToken = "";
  processing = false;

  document.getElementById("result").style.display =
    "none";

  document.getElementById("scannerStatus").innerHTML =
    "กำลังเปิดกล้อง...";

  startScanner();
}


/* =========================
   ปิดกล้อง
========================= */

function stopScanner(callback) {

  if (
    html5QrCode &&
    scannerRunning
  ) {

    html5QrCode.stop()

      .then(function() {

        scannerRunning = false;

        if (callback) {
          callback();
        }

      })

      .catch(function() {

        scannerRunning = false;

        if (callback) {
          callback();
        }

      });

  } else {

    scannerRunning = false;

    if (callback) {
      callback();
    }

  }
}


/* =========================
   ป้องกันข้อความ HTML
========================= */

function escapeHtml(value) {

  return String(value ?? "")

    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
