<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Staff Meal Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    #reader {
      max-width: 500px;
      margin: 20px auto;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #ff7a00;
      color: white;
    }

    #status {
      margin: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h2>🍱 Staff Meal Scanner</h2>

  <p>ทดสอบกล้องสำหรับสแกน QR</p>

  <button onclick="startScanner()">
    📷 เปิดกล้อง
  </button>

  <div id="status"></div>

  <div id="reader"></div>

  <script>

    let scanner;

    function startScanner() {

      document.getElementById("status").innerHTML =
        "กำลังเปิดกล้อง...";

      scanner = new Html5Qrcode("reader");

      scanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          }
        },

        function(decodedText) {

          document.getElementById("status").innerHTML =
            "✅ อ่าน QR ได้แล้ว";

          alert(decodedText);

        },

        function() {
          // ไม่ต้องแสดงข้อความระหว่างค้นหา QR
        }

      ).then(function() {

        document.getElementById("status").innerHTML =
          "✅ กล้องพร้อมสแกน";

      }).catch(function(error) {

        document.getElementById("status").innerHTML =
          "❌ เปิดกล้องไม่ได้: " + error;

      });
    }

  </script>

</body>
</html>
